        <circle cx="14" cy="14" r="3" fill="#38BDF8"/>
        <text x="26" y="18" font-size="10.5" class="mono" font-weight="600" fill="#E2F1FF">&#9883; React 18 · Vite · Tailwind CSS</text>
      </g>

      <g transform="translate(305, 0)">
        <rect width="290" height="28" rx="6" fill="#161B22" stroke="#30363D"/>
        <circle cx="14" cy="14" r="3" fill="#10B981"/>
        <text x="26" y="18" font-size="10.5" class="mono" font-weight="600" fill="#E2F1FF">&#128246; Offline Sync · IndexedDB PWA</text>
      </g>
    </g>
  </g>

