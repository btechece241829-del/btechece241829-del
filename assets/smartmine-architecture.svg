        <text x="10" y="36" class="card-sub">Anonymous hazard filing</text>
        <text x="10" y="49" class="card-sub">Event-sourced status history</text>
        <text x="10" y="62" class="card-sub">Immutable grievance logs</text>
        <text x="10" y="75" class="card-sub" fill="#F59E0B">Automated SLA escalation</text>
      </g>

      <g transform="translate(208, 0)">
        <rect width="195" height="85" rx="7" fill="#161B22" stroke="#30363D"/>
        <text x="10" y="20" class="card-title">&#128269; Inspection Workflows</text>
        <text x="10" y="36" class="card-sub">DGMS digital checklists</text>
        <text x="10" y="49" class="card-sub">Violation severity scoring</text>
        <text x="10" y="62" class="card-sub">Automated CAPA enforcement</text>
        <text x="10" y="75" class="card-sub" fill="#F59E0B">Photo &amp; video proof upload</text>
      </g>

      <g transform="translate(416, 0)">
        <rect width="195" height="85" rx="7" fill="#161B22" stroke="#30363D"/>
        <text x="10" y="20" class="card-title">&#9201; Attendance Mgmt</text>
        <text x="10" y="36" class="card-sub">QR-code badge checks</text>
        <text x="10" y="49" class="card-sub">Shift rosters &amp; headcount</text>
        <text x="10" y="62" class="card-sub">Contractor workforce sync</text>
        <text x="10" y="75" class="card-sub" fill="#F59E0B">Underground zone tracking</text>
      </g>

      <g transform="translate(624, 0)">
        <rect width="195" height="85" rx="7" fill="#161B22" stroke="#30363D"/>
        <text x="10" y="20" class="card-title">&#128220; Audit Trail &amp; RBAC</text>
        <text x="10" y="36" class="card-sub">8-tier permission matrix</text>
        <text x="10" y="49" class="card-sub">Zero unmonitored mutations</text>
        <text x="10" y="62" class="card-sub">Pre-deletion audit logging</text>
        <text x="10" y="75" class="card-sub" fill="#F59E0B">Statutory PDF &amp; CSV export</text>
      </g>
    </g>
