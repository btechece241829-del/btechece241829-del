<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 730" width="100%" height="730" fill="none">
  <defs>
    <linearGradient id="mineBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#081A2F"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D131C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .title-sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #38BDF8; letter-spacing: 1.5px; font-weight: 700; }
    .title-main { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14.5px; fill: #F0F6FC; font-weight: 800; }
    .box-header { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 800; letter-spacing: 1px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11.5px; font-weight: 700; fill: #E2F1FF; }
    .card-sub { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #8B949E; }
  </style>

  <!-- Frame Background -->
  <rect x="2" y="2" width="916" height="726" rx="14" fill="url(#mineBg)" stroke="#30363D" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <g transform="translate(35, 34)">
    <text x="0" y="0" class="title-sub">// VERIFIED SYSTEM ARCHITECTURE : SMART MINE</text>
    <text x="0" y="20" class="title-main">AI-Based Smart Governance &amp; Compliance Monitoring for Coal Mines</text>
    <rect x="730" y="-12" width="120" height="24" rx="12" fill="#161B22" stroke="#38BDF8" stroke-width="1"/>
    <circle cx="742" cy="0" r="3.5" fill="#38BDF8" filter="url(#glow)"/>
    <text x="752" y="3.5" font-size="9" fill="#58A6FF" class="mono" font-weight="700">SIH 2026 CORE</text>
  </g>

  <!-- ========================================================= -->
  <!-- 1. USER / ADMIN ROLES                                     -->
  <!-- ========================================================= -->
  <g transform="translate(35, 76)">
    <rect width="850" height="52" rx="9" fill="url(#cardGrad)" stroke="#0969DA" stroke-width="1.2"/>
    <rect x="1" y="1" width="170" height="50" rx="8" fill="#0A1C36"/>
    <text x="16" y="22" font-size="11" class="mono" font-weight="800" fill="#58A6FF">USER / ADMIN</text>
    <text x="16" y="38" font-size="9" class="mono" fill="#8B949E">Access Personas</text>

    <!-- Role Badges -->
    <g transform="translate(190, 12)">
      <rect x="0" y="0" width="150" height="28" rx="6" fill="#161B22" stroke="#30363D"/>
      <circle cx="14" cy="14" r="3" fill="#38BDF8"/>
      <text x="26" y="18" font-size="10.5" class="sans" font-weight="600" fill="#E2F1FF">&#128119; Mine Worker</text>

      <rect x="160" y="0" width="155" height="28" rx="6" fill="#161B22" stroke="#30363D"/>
      <circle cx="174" cy="14" r="3" fill="#F59E0B"/>
      <text x="186" y="18" font-size="10.5" class="sans" font-weight="600" fill="#E2F1FF">&#129486; Safety Officer</text>

      <rect x="325" y="0" width="165" height="28" rx="6" fill="#161B22" stroke="#30363D"/>
      <circle cx="339" cy="14" r="3" fill="#EF4444"/>
      <text x="351" y="18" font-size="10.5" class="sans" font-weight="600" fill="#E2F1FF">&#128203; DGMS Inspector</text>

      <rect x="500" y="0" width="145" height="28" rx="6" fill="#161B22" stroke="#30363D"/>
      <circle cx="514" cy="14" r="3" fill="#10B981"/>
      <text x="526" y="18" font-size="10.5" class="sans" font-weight="600" fill="#E2F1FF">&#127970; Executive Admin</text>
    </g>
  </g>

  <!-- Flow Connector 1 -->
  <g stroke="#38BDF8" stroke-width="1.8" opacity="0.75" transform="translate(460, 128)">
    <line x1="0" y1="0" x2="0" y2="18" stroke-dasharray="3,3"/>
    <polygon points="-4,18 0,25 4,18" fill="#38BDF8"/>
  </g>

