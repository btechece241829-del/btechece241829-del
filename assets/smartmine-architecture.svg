<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 340" width="100%" height="340" fill="none">
  <defs>
    <linearGradient id="mineBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#081A2F"/>
    </linearGradient>
    <linearGradient id="flowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969DA"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#58A6FF"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <filter id="mineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .col-title { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 12px; fill: #38BDF8; letter-spacing: 1px; }
    .item-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 600; font-size: 11.5px; fill: #E2F1FF; }
    .item-desc { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #8B949E; }
  </style>

  <!-- Outer Card Frame -->
  <rect x="2" y="2" width="946" height="336" rx="14" fill="url(#mineBg)" stroke="#30363D" stroke-width="1.5"/>

  <!-- Top Title Header -->
  <g transform="translate(30, 32)">
    <text x="0" y="0" fill="#38BDF8" font-size="11" class="mono" font-weight="700" letter-spacing="1.5">// SYSTEM ARCHITECTURE: MINEGOV AI</text>
    <text x="0" y="18" fill="#F0F6FC" font-size="14" class="sans" font-weight="800">AI-Based Smart Governance &amp; Compliance Monitoring Platform for Coal Mines (SIH 2026)</text>
  </g>

  <!-- Flow Arrows connecting the 4 pillars -->
  <g stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,4" opacity="0.6">
    <line x1="230" y1="185" x2="255" y2="185"/>
    <polygon points="255,181 263,185 255,189" fill="#38BDF8"/>

    <line x1="465" y1="185" x2="490" y2="185"/>
    <polygon points="490,181 498,185 490,189" fill="#38BDF8"/>

    <line x1="700" y1="185" x2="725" y2="185"/>
    <polygon points="725,181 733,185 725,189" fill="#38BDF8"/>
  </g>

  <!-- ========================================================= -->
  <!-- COLUMN 1: DATA INGESTION (X: 30)                          -->
  <!-- ========================================================= -->
  <g transform="translate(30, 75)">
    <rect width="200" height="235" rx="10" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1.2"/>
    <rect width="200" height="34" rx="10" fill="#091428" stroke="#30363D" stroke-width="1"/>
    <text x="14" y="22" class="col-title">01 // DATA INGESTION</text>

    <!-- Item 1 -->
    <g transform="translate(12, 48)">
      <rect width="176" height="38" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
      <text x="10" y="16" class="item-title">13 Disparate Datasets</text>
      <text x="10" y="30" class="item-desc">Mines, compliances, workers</text>
    </g>
    <!-- Item 2 -->
    <g transform="translate(12, 94)">
      <rect width="176" height="38" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
      <text x="10" y="16" class="item-title">IoT Telemetry Feeds</text>
      <text x="10" y="30" class="item-desc">27K+ gas, dust &amp; vibration rows</text>
    </g>
    <!-- Item 3 -->
    <g transform="translate(12, 140)">
      <rect width="176" height="38" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
      <text x="10" y="16" class="item-title">Geo-Tagged Inspections</text>
      <text x="10" y="30" class="item-desc">Time-stamped audit logs</text>
    </g>
    <!-- Item 4 -->
    <g transform="translate(12, 186)">
      <rect width="176" height="38" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
      <text x="10" y="16" class="item-title">OCR Document Parser</text>
      <text x="10" y="30" class="item-desc">Safety certificates digitization</text>
    </g>
  </g>

  <!-- ========================================================= -->
  <!-- COLUMN 2: AI & ANALYTICS ENGINE (X: 265)                 -->
  <!-- ========================================================= -->
  <g transform="translate(265, 75)">
    <rect width="200" height="235" rx="10" fill="url(#cardGrad)" stroke="#58A6FF" stroke-width="1.5" filter="url(#mineGlow)"/>
    <rect width="200" height="34" rx="10" fill="#091428" stroke="#58A6FF" stroke-width="1"/>
    <text x="14" y="22" class="col-title">02 // AI &amp; ANALYTICS</text>

    <!-- Item 1 -->
    <g transform="translate(12, 48)">
      <rect width="176" height="38" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
      <text x="10" y="16" class="item-title">Explainable Risk Engine</text>
      <text x="10" y="30" class="item-desc">Safety 30%, Compliance 22%</text>
    </g>
    <!-- Item 2 -->
    <g transform="translate(12, 94)">
      <rect width="176" height="38" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
      <text x="10" y="16" class="item-title">Sensor Anomaly Detection</text>
      <text x="10" y="30" class="item-desc">Methane &amp; hazard thresholding</text>
    </g>
    <!-- Item 3 -->
    <g transform="translate(12, 140)">
      <rect width="176" height="38" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
      <text x="10" y="16" class="item-title">Automated CAPA Pipeline</text>
      <text x="10" y="30" class="item-desc">Violation -> action -> verify</text>
    </g>
    <!-- Item 4 -->
    <g transform="translate(12, 186)">
      <rect width="176" height="38" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
      <text x="10" y="16" class="item-title">MineGov Copilot LLM</text>
      <text x="10" y="30" class="item-desc">Grounded factual Q&amp;A</text>
    </g>
  </g>

  <!-- ========================================================= -->
  <!-- COLUMN 3: SECURITY & TRUST LAYER (X: 500)                 -->
  <!-- ========================================================= -->
  <g transform="translate(500, 75)">
    <rect width="200" height="235" rx="10" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1.2"/>
    <rect width="200" height="34" rx="10" fill="#091428" stroke="#30363D" stroke-width="1"/>
    <text x="14" y="22" class="col-title">03 // TRUST &amp; SECURITY</text>

    <!-- Item 1 -->
    <g transform="translate(12, 48)">
      <rect width="176" height="38" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
      <text x="10" y="16" class="item-title">Blockchain Audit Trail</text>
      <text x="10" y="30" class="item-desc">Tamper-proof compliance logs</text>
    </g>
    <!-- Item 2 -->
    <g transform="translate(12, 94)">
      <rect width="176" height="38" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
      <text x="10" y="16" class="item-title">Role-Based Access (RBAC)</text>
      <text x="10" y="30" class="item-desc">8 Scoped enterprise roles</text>
    </g>
    <!-- Item 3 -->
    <g transform="translate(12, 140)">
      <rect width="176" height="38" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
      <text x="10" y="16" class="item-title">Firebase Data Synch</text>
      <text x="10" y="30" class="item-desc">Real-time distributed state</text>
    </g>
    <!-- Item 4 -->
    <g transform="translate(12, 186)">
      <rect width="176" height="38" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
      <text x="10" y="16" class="item-title">Escalation Chains</text>
      <text x="10" y="30" class="item-desc">Automated DGMS compliance</text>
    </g>
  </g>

  <!-- ========================================================= -->
  <!-- COLUMN 4: COMMAND CENTER & GIS (X: 735)                   -->
  <!-- ========================================================= -->
  <g transform="translate(735, 75)">
    <rect width="185" height="235" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5" filter="url(#mineGlow)"/>
    <rect width="185" height="34" rx="10" fill="#091428" stroke="#38BDF8" stroke-width="1"/>
    <text x="14" y="22" class="col-title">04 // COMMAND CENTER</text>

    <!-- Item 1 -->
    <g transform="translate(10, 48)">
      <rect width="165" height="38" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
      <text x="10" y="16" class="item-title">GIS Spatial Tracking</text>
      <text x="10" y="30" class="item-desc">MapLibre GL cluster maps</text>
    </g>
    <!-- Item 2 -->
    <g transform="translate(10, 94)">
      <rect width="165" height="38" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
      <text x="10" y="16" class="item-title">Multi-Mine Risk Matrix</text>
      <text x="10" y="30" class="item-desc">Corporate vs mine views</text>
    </g>
    <!-- Item 3 -->
    <g transform="translate(10, 140)">
      <rect width="165" height="38" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
      <text x="10" y="16" class="item-title">Executive Reports</text>
      <text x="10" y="30" class="item-desc">PDF / Excel audit export</text>
    </g>
    <!-- Item 4 -->
    <g transform="translate(10, 186)">
      <rect width="165" height="38" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
      <text x="10" y="16" class="item-title">Incident Feed &amp; SOS</text>
      <text x="10" y="30" class="item-desc">Near-miss &amp; hazard warnings</text>
    </g>
  </g>
</svg>