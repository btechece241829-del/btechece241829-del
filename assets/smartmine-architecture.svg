  <g stroke="#38BDF8" stroke-width="1.8" opacity="0.75" transform="translate(460, 206)">
    <line x1="0" y1="0" x2="0" y2="18" stroke-dasharray="3,3"/>
    <polygon points="-4,18 0,25 4,18" fill="#38BDF8"/>
  </g>

