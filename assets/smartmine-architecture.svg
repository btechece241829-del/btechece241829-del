  <!-- ========================================================= -->
  <!-- 5. DATA / TRUST LAYER                                     -->
  <!-- ========================================================= -->
  <g transform="translate(35, 541)">
    <rect width="850" height="135" rx="9" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.2"/>
    <rect x="1" y="1" width="848" height="28" rx="8" fill="#042018"/>
    <text x="16" y="19" class="box-header" fill="#34D399">&#128737; DATA / TRUST LAYER</text>
    <text x="200" y="18" font-size="9" class="mono" fill="#8B949E">Cryptographic Integrity · Hybrid Cloud Store · Spatial GIS Boundaries</text>

    <!-- 3 Data / Trust Pillars -->
    <g transform="translate(15, 38)">
      <g transform="translate(0, 0)">
        <rect width="262" height="85" rx="7" fill="#161B22" stroke="#30363D"/>
        <text x="12" y="20" class="card-title">&#128293; Firebase Platform</text>
        <text x="12" y="36" class="card-sub">Firestore: Interactive source of truth</text>
        <text x="12" y="49" class="card-sub">Firebase Auth: Verified token roles</text>
        <text x="12" y="62" class="card-sub">Firebase Storage: Inspection media</text>
        <text x="12" y="75" class="card-sub" fill="#34D399">5s timeout &amp; IndexedDB offline buffer</text>
      </g>

      <g transform="translate(278, 0)">
        <rect width="262" height="85" rx="7" fill="#161B22" stroke="#30363D"/>
        <text x="12" y="20" class="card-title">&#128506; GIS Location Support</text>
        <text x="12" y="36" class="card-sub">Leaflet &amp; React-Leaflet GIS engine</text>
        <text x="12" y="49" class="card-sub">GeoJSON pit perimeters &amp; shaft pins</text>
        <text x="12" y="62" class="card-sub">Real-time incident &amp; sensor clusters</text>
        <text x="12" y="75" class="card-sub" fill="#34D399">GPS coordinates stamped on inspections</text>
      </g>

      <g transform="translate(556, 0)">
        <rect width="264" height="85" rx="7" fill="#161B22" stroke="#30363D"/>
        <text x="12" y="20" class="card-title">&#9939; Blockchain Trust Layer</text>
        <text x="12" y="36" class="card-sub">10 Solidity ledgers (Hardhat 31337)</text>
        <text x="12" y="49" class="card-sub">Deterministic SHA-256 canonical hashing</text>
        <text x="12" y="62" class="card-sub">ethers.js v6 BrowserProvider &amp; RPC</text>
        <text x="12" y="75" class="card-sub" fill="#34D399">VERIFIED / TAMPERED audit verification</text>
      </g>
    </g>
