  <!-- 2. SMART MINE PLATFORM                                    -->
  <!-- ========================================================= -->
  <g transform="translate(35, 154)">
    <rect width="850" height="52" rx="9" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.4"/>
    <rect x="1" y="1" width="220" height="50" rx="8" fill="#08203E"/>
    <text x="16" y="22" font-size="11.5" class="mono" font-weight="800" fill="#38BDF8">SMART MINE PLATFORM</text>
    <text x="16" y="38" font-size="9" class="mono" fill="#8B949E">Unified Client Gateway</text>

