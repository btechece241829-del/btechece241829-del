        <text x="12" y="20" class="card-title">&#9889; Predictive Risk Detection</text>
        <text x="12" y="37" class="card-sub">IsolationForest multi-feature ML</text>
        <text x="12" y="50" class="card-sub">27,000+ sensor reading telemetry</text>
        <text x="12" y="63" class="card-sub" fill="#A78BFA">Dynamic Low / Mod / High / Crit bands</text>
      </g>

      <g transform="translate(556, 0)">
        <rect width="264" height="72" rx="7" fill="#161B22" stroke="#30363D"/>
        <text x="12" y="20" class="card-title">&#128196; OCR Document Digitization</text>
