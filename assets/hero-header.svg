<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 300" width="100%" height="300" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#091428"/>
    </linearGradient>

    <!-- Glowing Cyan/Blue Gradients -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969DA"/>
      <stop offset="50%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#E2F1FF"/>
      <stop offset="80%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0969DA" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="gridFade" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="80%" stop-color="#0969DA" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0969DA" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Filters for Futuristic Neon Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .neon-text { font-family: 'JetBrains Mono', monospace; font-weight: 800; }
  </style>

  <!-- Base Card Frame -->
  <rect x="2" y="2" width="946" height="296" rx="14" fill="url(#bgGrad)" stroke="#30363D" stroke-width="1.5"/>
  <rect x="2" y="2" width="946" height="296" rx="14" fill="none" stroke="url(#cyanBlue)" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Perspective 3D Grid on Base -->
  <g opacity="0.8">
    <path d="M 50 300 L 250 160 M 150 300 L 310 160 M 250 300 L 370 160 M 350 300 L 430 160 M 450 300 L 490 160 M 550 300 L 550 160 M 650 300 L 610 160 M 750 300 L 670 160 M 850 300 L 730 160" stroke="#58A6FF" stroke-width="0.75" stroke-opacity="0.18"/>
    <line x1="120" y1="260" x2="880" y2="260" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.25"/>
    <line x1="200" y1="220" x2="820" y2="220" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.18"/>
    <line x1="260" y1="185" x2="760" y2="185" stroke="#38BDF8" stroke-width="0.5" stroke-opacity="0.12"/>
    <line x1="300" y1="160" x2="700" y2="160" stroke="#38BDF8" stroke-width="0.5" stroke-opacity="0.08"/>
  </g>

  <!-- Futuristic Holographic Radar / Targeting System (Right Side) -->
  <g transform="translate(800, 150)">
    <!-- Radar Rings -->
    <circle cx="0" cy="0" r="115" fill="none" stroke="#58A6FF" stroke-width="0.5" stroke-opacity="0.15"/>
    <circle cx="0" cy="0" r="95" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="6,8"/>
    <circle cx="0" cy="0" r="75" fill="url(#radarGrad)"/>
    <circle cx="0" cy="0" r="75" fill="none" stroke="#58A6FF" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="40,15,60,20"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.4"/>
    <circle cx="0" cy="0" r="25" fill="none" stroke="#58A6FF" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="0" cy="0" r="4" fill="#38BDF8" filter="url(#neonGlow)"/>

    <!-- Crosshairs & Orbit Markers -->
    <line x1="-125" y1="0" x2="125" y2="0" stroke="#58A6FF" stroke-width="0.75" stroke-opacity="0.3" stroke-dasharray="3,3"/>
    <line x1="0" y1="-125" x2="0" y2="125" stroke="#58A6FF" stroke-width="0.75" stroke-opacity="0.3" stroke-dasharray="3,3"/>
    
    <!-- Coordinate HUD labels -->
    <text x="58" y="-58" fill="#38BDF8" font-size="8" class="mono" opacity="0.7">TARGET.AI</text>
    <text x="-95" y="80" fill="#58A6FF" font-size="8" class="mono" opacity="0.6">SYS_AZ: 128.4?</text>
    <text x="-80" y="-80" fill="#58A6FF" font-size="8" class="mono" opacity="0.6">NODE_ACTIVE</text>
    
    <!-- 3D Orbit Ellipse -->
    <ellipse cx="0" cy="0" rx="110" ry="38" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4" transform="rotate(-25)"/>
    <ellipse cx="0" cy="0" rx="110" ry="38" fill="none" stroke="#58A6FF" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="8,6" transform="rotate(35)"/>
    <circle cx="65" cy="-28" r="3" fill="#38BDF8" filter="url(#softGlow)"/>
    <circle cx="-75" cy="20" r="2.5" fill="#58A6FF"/>
  </g>

  <!-- HUD Corner Brackets -->
  <path d="M 16 38 L 16 16 L 38 16" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 934 38 L 934 16 L 912 16" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 16 262 L 16 284 L 38 284" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 934 262 L 934 284 L 912 284" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Top Status / Diagnostic HUD Bar -->
  <g transform="translate(45, 36)">
    <!-- Status Indicator Pill -->
    <rect x="0" y="0" width="135" height="22" rx="11" fill="#091428" stroke="#0969DA" stroke-width="1"/>
    <circle cx="12" cy="11" r="4" fill="#38BDF8" filter="url(#neonGlow)"/>
    <text x="24" y="15" fill="#38BDF8" font-size="9.5" font-weight="700" class="mono" letter-spacing="1">SYSTEM: ONLINE</text>

    <!-- Subsystem Pills -->
    <rect x="145" y="0" width="165" height="22" rx="11" fill="#091428" stroke="#30363D" stroke-width="1"/>
    <text x="156" y="15" fill="#8B949E" font-size="9.5" class="mono">NODE // <tspan fill="#58A6FF" font-weight="600">PRADIP-STATION</tspan></text>

    <rect x="320" y="0" width="220" height="22" rx="11" fill="#091428" stroke="#30363D" stroke-width="1"/>
    <text x="332" y="15" fill="#8B949E" font-size="9.5" class="mono">SECURITY // <tspan fill="#4ADE80" font-weight="600">VERIFIED DEV</tspan></text>
  </g>

  <!-- Left Side Identity Core -->
  <g transform="translate(45, 95)">
    <!-- Terminal Prompt Line -->
    <text x="0" y="0" fill="#38BDF8" font-size="12" class="mono" letter-spacing="1.5" opacity="0.9">> INITIALIZING QUANTUM WORKSPACE v2.6...</text>

    <!-- Main Name Typography -->
    <text x="0" y="48" fill="url(#textGrad)" font-size="44" class="sans" font-weight="900" letter-spacing="2.5" filter="url(#softGlow)">PRADIP KUMAR</text>

    <!-- Core Title & Focus -->
    <g transform="translate(0, 78)">
      <rect x="0" y="-14" width="6" height="18" fill="#38BDF8"/>
      <text x="16" y="0" fill="#E2F1FF" font-size="14.5" class="mono" font-weight="700" letter-spacing="1.5">
        SOFTWARE DEVELOPER <tspan fill="#38BDF8">|</tspan> AI &amp; EMBEDDED <tspan fill="#38BDF8">|</tspan> CYBERSECURITY
      </text>
    </g>

    <!-- Professional Mission Statement -->
    <text x="0" y="112" fill="#8B949E" font-size="12.5" class="sans" font-weight="400">
      Architecting predictive AI decision platforms, smart industrial compliance &amp; defense-grade software.
    </text>

    <!-- Spec Badges Row -->
    <g transform="translate(0, 142)">
      <!-- Badge 1: SIH -->
      <rect x="0" y="0" width="138" height="24" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#FFA657"/>
      <text x="24" y="15.5" fill="#E2F1FF" font-size="10.5" class="mono">SIH 2026 COAL MINE</text>

      <!-- Badge 2: WAREX-AI -->
      <rect x="148" y="0" width="130" height="24" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <circle cx="160" cy="12" r="3.5" fill="#58A6FF"/>
      <text x="172" y="15.5" fill="#E2F1FF" font-size="10.5" class="mono">WAREX-AI ENGINE</text>

      <!-- Badge 3: ISRO -->
      <rect x="288" y="0" width="128" height="24" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <circle cx="300" cy="12" r="3.5" fill="#38BDF8"/>
      <text x="312" y="15.5" fill="#E2F1FF" font-size="10.5" class="mono">ISRO BAH 2026</text>

      <!-- Badge 4: SEC -->
      <rect x="426" y="0" width="138" height="24" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <circle cx="438" cy="12" r="3.5" fill="#F43F5E"/>
      <text x="450" y="15.5" fill="#E2F1FF" font-size="10.5" class="mono">UPI DEFENSE SUITE</text>
    </g>
  </g>

  <!-- Glowing Accent Line on Top Border -->
  <line x1="80" y1="2" x2="480" y2="2" stroke="url(#cyanBlue)" stroke-width="2.5" filter="url(#softGlow)"/>
  <line x1="720" y1="298" x2="880" y2="298" stroke="url(#cyanBlue)" stroke-width="2.5" filter="url(#softGlow)"/>
</svg>