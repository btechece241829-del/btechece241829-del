<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 26" width="100%" height="26" fill="none">
  <defs>
    <linearGradient id="divGradLeft" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#0969DA" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0969DA" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="divGradRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#0969DA" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0969DA" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="divGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Central Holographic Node -->
  <g transform="translate(475, 13)">
    <!-- Hexagonal / Diamond Center -->
    <polygon points="0,-9 9,0 0,9 -9,0" fill="#0D1117" stroke="#38BDF8" stroke-width="1.5" filter="url(#divGlow)"/>
    <circle cx="0" cy="0" r="3" fill="#58A6FF"/>

    <!-- Dual Wing Nodes -->
    <circle cx="-24" cy="0" r="2" fill="#38BDF8" opacity="0.8"/>
    <circle cx="24" cy="0" r="2" fill="#38BDF8" opacity="0.8"/>
    
    <line x1="-16" y1="0" x2="-9" y2="0" stroke="#38BDF8" stroke-width="1"/>
    <line x1="9" y1="0" x2="16" y2="0" stroke="#38BDF8" stroke-width="1"/>
  </g>

  <!-- Left Circuit Trace with Step -->
  <path d="M 445 13 L 400 13 L 390 6 L 150 6 L 140 13 L 20 13" stroke="url(#divGradLeft)" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="390" cy="6" r="2" fill="#58A6FF" opacity="0.7"/>
  <circle cx="150" cy="6" r="2" fill="#58A6FF" opacity="0.5"/>

  <!-- Right Circuit Trace with Step -->
  <path d="M 505 13 L 550 13 L 560 20 L 800 20 L 810 13 L 930 13" stroke="url(#divGradRight)" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="560" cy="20" r="2" fill="#58A6FF" opacity="0.7"/>
  <circle cx="800" cy="20" r="2" fill="#58A6FF" opacity="0.5"/>
</svg>