<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Snake Game · PRADIP KUMAR</title>
<style>
  :root {
    --bg: #0b0e1a;
    --panel: #12172b;
    --neon: #38bdf8;
    --accent: #a78bfa;
    --danger: #f43f5e;
    --success: #4ade80;
    --text: #e2e8f0;
    --dim: #7c8db5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1b2342 0%, var(--bg) 55%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .app {
    width: min(560px, 96vw);
    background: rgba(18, 23, 43, 0.85);
    border: 1px solid rgba(56, 189, 248, 0.25);
    border-radius: 20px;
    padding: 20px 20px 24px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.55), 0 0 40px rgba(56,189,248,0.12);
    backdrop-filter: blur(6px);
  }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
  h1 {
    font-size: 22px;
    background: linear-gradient(90deg, var(--neon), var(--accent), var(--danger));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 0.6px;
  }
  .scorebox { display: flex; gap: 10px; }
  .pill {
    background: rgba(56,189,248,0.12);
    border: 1px solid rgba(56,189,248,0.3);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 13px;
    font-weight: 600;
  }
  .pill b { color: var(--neon); font-variant-numeric: tabular-nums; }
  .pill.best b { color: var(--accent); }
  canvas {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #0a0d18;
    border: 1px solid rgba(56,189,248,0.25);
    border-radius: 14px;
    touch-action: none;
  }
  .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; gap: 10px; flex-wrap: wrap; }
  .btns { display: flex; gap: 8px; }
  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    background: rgba(56,189,248,0.14);
    border: 1px solid rgba(56,189,248,0.4);
    border-radius: 10px;
    padding: 8px 14px;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  button:hover { background: rgba(56,189,248,0.28); }
  button:active { transform: scale(0.96); }
  button.primary { background: linear-gradient(90deg, var(--neon), var(--accent)); border: none; color: #0b0e1a; }
  select {
    font-family: inherit;
    font-size: 13px;
    background: #0f1426;
    color: var(--text);
    border: 1px solid rgba(56,189,248,0.35);
    border-radius: 8px;
    padding: 6px 10px;
  }
  .dpad {
    display: none;
    grid-template-columns: repeat(3, 58px);
    grid-template-rows: repeat(2, 58px);
    gap: 6px;
    justify-content: center;
    margin-top: 14px;
  }
  .dpad button { font-size: 22px; border-radius: 12px; background: rgba(167,139,250,0.14); border-color: rgba(167,139,250,0.4); }
  .dpad .up { grid-column: 2; }
  .overlay {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(6, 8, 16, 0.72);
    backdrop-filter: blur(3px);
    z-index: 10;
    text-align: center;
  }
  .overlay.hidden { display: none; }
  .card {
    background: var(--panel);
    border: 1px solid rgba(56,189,248,0.3);
    border-radius: 18px;
    padding: 30px 34px;
    max-width: 340px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.6);
  }
  .card h2 { font-size: 26px; margin-bottom: 8px; }
  .card p { color: var(--dim); margin-bottom: 18px; font-size: 14px; line-height: 1.5; }
  .card .final-score { font-size: 20px; color: var(--success); font-weight: 700; margin-bottom: 14px; }
  .legend { margin-top: 12px; font-size: 12px; color: var(--dim); display:flex; justify-content:center; gap:14px; flex-wrap:wrap; }
  footer { margin-top: 12px; text-align: center; font-size: 12px; color: var(--dim); }
  footer a { color: var(--neon); text-decoration: none; }
  @media (pointer: coarse) { .dpad { display: grid; } }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🐍 NEON SNAKE</h1>
      <div class="scorebox">
        <span class="pill">Score <b id="score">0</b></span>
        <span class="pill best">Best <b id="best">0</b></span>
      </div>
    </header>

    <canvas id="game" width="480" height="480"></canvas>

    <div class="controls">
      <div class="btns">
        <button id="btnStart" class="primary">▶ Start</button>
        <button id="btnPause">⏸ Pause</button>
      </div>
      <label>⚡ Speed
        <select id="speed">
          <option value="160">Easy</option>
          <option value="110" selected>Medium</option>
          <option value="75">Hard</option>
          <option value="50">Insane</option>
        </select>
      </label>
    </div>

    <div class="dpad">
      <button class="up" data-dir="up">▲</button>
      <button data-dir="left">◀</button>
      <button data-dir="right">▶</button>
      <button data-dir="down">▼</button>
    </div>

    <div class="legend">🟢 food · ⭐ bonus · 🚫 walls kill</div>
    <footer>Made by <a href="https://github.com/btechece241829-del">PRADIP KUMAR</a> — arrow keys / WASD / swipe</footer>
  </div>

  <div class="overlay" id="overlay">
    <div class="card" id="card">
      <h2 id="ovTitle">🐍 NEON SNAKE</h2>
      <p id="ovText">Eat the food, grow long, and don't crash into walls or yourself. Arrow keys, WASD, or swipe to move.</p>
      <div class="final-score hidden" id="ovScore"></div>
      <button class="primary" id="btnOK">▶ Start Playing</button>
    </div>
  </div>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const CELL = 24;
  const GRID = canvas.width / CELL; // 20 x 20

  const ui = {
    score: document.getElementById("score"),
    best: document.getElementById("best"),
    btnStart: document.getElementById("btnStart"),
    btnPause: document.getElementById("btnPause"),
    speed: document.getElementById("speed"),
    overlay: document.getElementById("overlay"),
    card: document.getElementById("card"),
    ovTitle: document.getElementById("ovTitle"),
    ovText: document.getElementById("ovText"),
    ovScore: document.getElementById("ovScore"),
    btnOK: document.getElementById("btnOK"),
  };

  const BEST_KEY = "pk.neon-snake.best.v1";
  let best = Number(localStorage.getItem(BEST_KEY) || 0);
  ui.best.textContent = best;

  let snake, dir, queue, food, bonus, bonusTimer, score, speedMs, raf, lastTick, running, paused, over;

  function reset() {
    const mid = Math.floor(GRID / 2);
    snake = [{ x: mid, y: mid }, { x: mid - 1, y: mid }, { x: mid - 2, y: mid }];
    dir = { x: 1, y: 0 };
    queue = [];
    score = 0;
    paused = false;
    over = false;
    running = false;
    bonus = null;
    bonusTimer = 0;
    ui.score.textContent = "0";
    placeFood();
  }

  function randCell() {
    return {
      x: Math.floor(Math.random() * GRID),
      y: Math.floor(Math.random() * GRID),
    };
  }

  function placeFood() {
    let p;
    do { p = randCell(); } while (snake.some(s => s.x === p.x && s.y === p.y) || (bonus && bonus.x === p.x && bonus.y === p.y));
    food = p;
  }

  function spawnBonus() {
    if (bonus) return;
    let p;
    do { p = randCell(); } while (snake.some(s => s.x === p.x && s.y === p.y) || (food.x === p.x && food.y === p.y));
    bonus = p;
    bonusTimer = 56; // ticks left
  }

  function start() {
    reset();
    running = true;
    over = false;
    ui.overlay.classList.add("hidden");
    lastTick = performance.now();
    speedMs = Number(ui.speed.value);
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(loop);
  }

  function loop(now) {
    if (!running) return;
    if (!paused && now - lastTick >= speedMs) {
      lastTick = now;
      tick();
      if (over) { endGame(); return; }
    }
    draw();
    raf = requestAnimationFrame(loop);
  }

  function turn(x, y) {
    if (!running || paused || over) return;
    const last = queue.length ? queue[queue.length - 1] : dir;
    if ((last.x === x && last.y === y) || (last.x === -x && last.y === -y)) return; // same or reverse
    if (queue.length < 2) queue.push({ x, y });
  }

  function tick() {
    if (queue.length) dir = queue.shift();
    const head = snake[0];
    const next = { x: head.x + dir.x, y: head.y + dir.y };

    if (next.x < 0 || next.y < 0 || next.x >= GRID || next.y >= GRID) { over = true; return; }
    if (snake.some(s => s.x === next.x && s.y === next.y)) { over = true; return; }

    snake.unshift(next);
let ate = false;
    if (food.x === next.x && food.y === next.y) {
      score += 10;
      ate = true;
      placeFood();
      if (Math.random() < 0.22) spawnBonus();
    } else if (bonus && bonus.x === next.x && bonus.y === next.y) {
      score += 30;
      ate = true;
      bonus = null;
    }

    if (!ate) snake.pop();
    if (bonus) {
      bonusTimer--;
      if (bonusTimer <= 0) bonus = null;
    }
    ui.score.textContent = score;

    const cap = [160, 110, 75, 50][Number(ui.speed.selectedIndex)];
    const min = Math.max(45, cap - 12);
    speedMs = Math.max(min, cap - Math.floor(snake.length / 8) * 6);
  }

  function endGame() {
    running = false;
    if (score > best) {
      best = score;
      localStorage.setItem(BEST_KEY, String(best));
      ui.best.textContent = best;
    }
    ui.ovTitle.textContent = "💀 Game Over";
    ui.ovText.textContent = "The snake crashed. Don't worry, it happens to the best of us.";
    ui.ovScore.textContent = "Final score: " + score + " — Best: " + best;
    ui.ovScore.classList.remove("hidden");
    ui.btnOK.textContent = "↻ Play Again";
    ui.overlay.classList.remove("hidden");
    draw();
  }

  function togglePause() {
    if (!running || over) return;
    paused = !paused;
    ui.btnPause.textContent = paused ? "▶ Resume" : "⏸ Pause";
    if (!paused) lastTick = performance.now();
  }
// ---- drawing ----
  function roundRect(x, y, w, h, r) {
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.fillStyle = "#0a0d18";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = "rgba(56,189,248,0.06)";
    ctx.lineWidth = 1;
    for (let i = 1; i < GRID; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
    }

    if (bonus) {
      const cx = bonus.x * CELL + CELL / 2, cy = bonus.y * CELL + CELL / 2;
      ctx.save();
      ctx.shadowColor = "#fde047"; ctx.shadowBlur = 14;
      ctx.fillStyle = "#fde047";
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const a = (i * 4 * Math.PI) / 5 - Math.PI / 2;
        const x = cx + Math.cos(a) * 9, y = cy + Math.sin(a) * 9;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    const fx = food.x * CELL + CELL / 2, fy = food.y * CELL + CELL / 2;
    ctx.save();
    ctx.shadowColor = "#4ade80"; ctx.shadowBlur = 16;
    ctx.fillStyle = "#4ade80";
    ctx.beginPath(); ctx.arc(fx, fy, 8, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "#86efac"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(fx, fy, 8, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "#166534";
    ctx.beginPath(); ctx.ellipse(fx + 3, fy - 9, 4, 2.4, 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // snake segments
    snake.forEach((seg, i) => {
      const pad = i === 0 ? 2 : 3;
      const x = seg.x * CELL + pad, y = seg.y * CELL + pad, size = CELL - pad * 2;
      const t = i / Math.max(snake.length - 1, 1);
      const hue = 190 + t * 55;
      ctx.save();
      ctx.shadowColor = "hsl(" + hue + ",90%,62%)";
      ctx.shadowBlur = i === 0 ? 14 : 6;
      ctx.beginPath();
      roundRect(x, y, size, size, i === 0 ? 9 : 8);
      ctx.fillStyle = i === 0 ? "#7dd3fc" : "hsl(" + hue + ",85%,52%)";
      ctx.fill();
      ctx.restore();
    });

    // eyes on head
    const h = snake[0];
    const hx = h.x * CELL + CELL / 2, hy = h.y * CELL + CELL / 2;
    const ex = dir.y !== 0 ? 5 : 8, ey = dir.x !== 0 ? 5 : 8;
    ctx.fillStyle = "#0b0e1a";
    ctx.beginPath();
    ctx.arc(hx + dir.x * ex - dir.y * ex * 0.5, hy + dir.y * ey - dir.x * ey * 0.5, 2.6, 0, Math.PI * 2);
    ctx.arc(hx + dir.x * ex + dir.y * ex * 0.5, hy + dir.y * ey + dir.x * ey * 0.5, 2.6, 0, Math.PI * 2);
    ctx.fill();

    if (paused) {
      ctx.fillStyle = "rgba(10,13,24,0.55)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#e2e8f0";
      ctx.font = "700 34px 'Segoe UI', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("PAUSED", canvas.width / 2, canvas.height / 2 + 12);
    }
  }

  // ---- input ----
  window.addEventListener("keydown", (e) => {
    const map = {
      ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0],
      w:[0,-1], s:[0,1], a:[-1,0], d:[1,0],
      W:[0,-1], S:[0,1], A:[-1,0], D:[1,0],
    };
    if (e.key in map) { e.preventDefault(); turn(map[e.key][0], map[e.key][1]); }
    if (e.key === " " || e.key === "p" || e.key === "P") { e.preventDefault(); togglePause(); }
  });

  let ts = null;
  canvas.addEventListener("touchstart", (e) => {
    const t = e.touches[0];
    ts = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  canvas.addEventListener("touchend", (e) => {
    if (!ts) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - ts.x, dy = t.clientY - ts.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 22) {
      if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
      else turn(0, dy > 0 ? 1 : -1);
    }
    ts = null;
  }, { passive: true });

  document.querySelectorAll(".dpad button").forEach((b) => {
    b.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      const map = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
      const d = map[b.dataset.dir];
      turn(d[0], d[1]);
    });
  });

  ui.btnOK.addEventListener("click", start);
  ui.btnStart.addEventListener("click", start);
  ui.btnPause.addEventListener("click", togglePause);

  reset();
  // show overlay on load
  ui.ovTitle.textContent = "🐍 NEON SNAKE";
  ui.ovText.textContent = "Eat the food, grow long, don't crash! Arrow keys / WASD / swipe to move.";
  ui.ovScore.classList.add("hidden");
  ui.btnOK.textContent = "▶ Start Playing";
  ui.overlay.classList.remove("hidden");
  draw();
})();
</script>
</body>
</html>
